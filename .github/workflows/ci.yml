name: Validate and build
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      approve_disposable_user_services:
        description: Run only the explicit disposable user service pilots
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  validate:
    if: ${{ !inputs.approve_disposable_user_services }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: windows-2025
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Verify Windows PATH contract
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-windows-path.ps1
      - name: Install pinned toolchain
        run: rustup toolchain install 1.94.0 --profile minimal --component rustfmt --component clippy
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: Validate service fixtures without activation
        run: python scripts/test_service_fixtures.py
      - run: cargo doc --workspace --no-deps --locked
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Validate offline memory migration safeguards
        if: runner.os != 'Windows'
        run: python3 scripts/test_memory_migration.py
      - run: python scripts/test_distribution.py
      - run: python scripts/distribution.py list
      - run: python scripts/test_package.py
      - run: python scripts/licenses.py
      - name: Package binary and notices
        run: python scripts/package.py ${{ matrix.target }}
      - name: Verify Windows installation and preservation
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-windows-install.ps1
      - name: Verify deferred native pilot preparation
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-windows-pilot.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: illumitech-forge-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
  native-services:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.approve_disposable_user_services }}
    uses: ./.github/workflows/service-native.yml
    with:
      approve_disposable_user_services: true
