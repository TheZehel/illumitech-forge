[package]
name = "illumitech-forge-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
authors.workspace = true
description = "Evidence-backed agent execution CLI"
readme = "README.md"
include = ["src/**", "tests/**", "Cargo.toml", "README.md", "LICENSE", "THIRD_PARTY_NOTICES", "THIRD_PARTY_LICENSES/**", "dependencies.json"]
[dependencies]
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
sha2.workspace = true
fs2.workspace = true
rusqlite = { workspace = true, features = ["hooks"] }
forge-domain = { package = "illumitech-forge-domain", version = "=0.3.0", path = "../forge-domain" }
forge-adapters = { package = "illumitech-forge-adapters", version = "=0.3.0", path = "../forge-adapters" }
forge-catalog = { package = "illumitech-forge-catalog", version = "=0.3.0", path = "../forge-catalog" }

[[bin]]
name = "illumitech-forge"
path = "src/main.rs"

[dev-dependencies]
tempfile.workspace = true
