[package]
name = "illumitech-forge-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
authors.workspace = true
description = "Evidence-backed agent execution CLI"
default-run = "forge"
readme = "README.md"
include = ["src/**", "build.rs", "ui-dist/**", "tests/**", "Cargo.toml", "README.md", "LICENSE", "THIRD_PARTY_NOTICES", "THIRD_PARTY_LICENSES/**", "dependencies.json"]
[dependencies]
getrandom = "=0.4.3"
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
sha2.workspace = true
fs2.workspace = true
libc.workspace = true
rusqlite = { workspace = true, features = ["hooks", "backup"] }
tempfile.workspace = true
forge-domain = { package = "illumitech-forge-domain", version = "=1.5.0", path = "../forge-domain" }
forge-adapters = { package = "illumitech-forge-adapters", version = "=1.5.0", path = "../forge-adapters" }
forge-catalog = { package = "illumitech-forge-catalog", version = "=1.5.0", path = "../forge-catalog" }
ratatui = { version = "=0.30.2", default-features = false, features = ["crossterm", "unstable-rendered-line-info"] }
crossterm = "=0.29.0"
pulldown-cmark = { version = "=0.13.6", default-features = false }

[[bin]]
name = "illumitech-forge"
path = "src/main.rs"
test = false

[[bin]]
name = "forge"
path = "src/bin/forge.rs"
test = false

[dev-dependencies]
tempfile.workspace = true
