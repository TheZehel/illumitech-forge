[package]
name = "illumitech-forge-adapters"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
authors.workspace = true
description = "Native process, memory and telemetry adapters for Illumitech Forge"
readme = "README.md"
include = ["src/**", "tests/**", "Cargo.toml", "README.md", "LICENSE", "THIRD_PARTY_NOTICES", "THIRD_PARTY_LICENSES/**", "dependencies.json"]
[dependencies]
forge-domain = { package = "illumitech-forge-domain", version = "=1.7.1", path = "../forge-domain" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
libc.workspace = true
reqwest.workspace = true
sha2.workspace = true
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[dev-dependencies]
tempfile.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Pipes"] }
